<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f9f9f7" />
    <title>离线 · Tiny Password</title>
    <style>
      :root { color-scheme: light; font-family: Georgia, serif; background: #f9f9f7; color: #111; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(42rem, calc(100% - 3rem)); border-top: 4px solid #111; padding: 2rem 0; }
      p { line-height: 1.7; max-width: 34rem; }
      .label { font: 0.75rem/1.4 monospace; letter-spacing: .12em; text-transform: uppercase; color: #666; }
    </style>
  </head>
  <body>
    <main>
      <p class="label">Tiny Password · Offline</p>
      <h1>当前处于离线状态</h1>
      <p>请恢复网络连接后重试。为保护保险库，离线时不会显示或解锁上次打开的保险库内容。</p>
    </main>
  </body>
</html>
