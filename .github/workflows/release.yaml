name: release

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version (for example 1.0.0-rc.1)"
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  validate:
    name: Validate ${{ matrix.arch }} full release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build validation image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: tiny-password:validate-${{ matrix.arch }}
          build-args: VERSION=validate-${{ matrix.arch }}
          cache-from: type=gha,scope=tiny-password-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=tiny-password-${{ matrix.arch }}
      - name: Run real application acceptance
        env:
          IMAGE: tiny-password:validate-${{ matrix.arch }}
        run: bash scripts/test-e2e.sh
      - name: Run the bundled 7-Zip binary
        run: docker run --rm --platform linux/${{ matrix.arch }} --entrypoint /usr/local/bin/7zz tiny-password:validate-${{ matrix.arch }} i
      - name: Scan validation image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tiny-password:validate-${{ matrix.arch }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  publish:
    name: Publish multi-architecture image
    needs: [validate]
    runs-on: ubuntu-latest
    # Master/manual dispatch are fast paths; full v*.*.* tags require validate.
    if: >-
      always() &&
      (
        github.ref == 'refs/heads/master' ||
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch'
      ) &&
      (
        github.ref == 'refs/heads/master' ||
        github.event_name == 'workflow_dispatch' ||
        needs.validate.result == 'success'
      )
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Calculate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,format=long,prefix=sha-,enable=${{ github.ref == 'refs/heads/master' }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, publish, and attach provenance/SBOM
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: |
            type=gha,scope=tiny-password-publish
            type=gha,scope=tiny-password-amd64
            type=gha,scope=tiny-password-arm64
          cache-to: type=gha,mode=max,scope=tiny-password-publish
          provenance: mode=max
          sbom: true
      - name: Inspect published manifest
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            docker buildx imagetools inspect "${IMAGE_NAME}:latest"
          else
            docker buildx imagetools inspect "${IMAGE_NAME}:${{ steps.meta.outputs.version }}"
          fi
