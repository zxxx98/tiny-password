name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix web test -- --run
      - run: npm --prefix web run build

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  docker:
    runs-on: ubuntu-latest
    needs: [web, go]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tiny-password:ci .
      - name: smoke test container
        run: |
          docker run -d --name smoke -p 127.0.0.1:18080:8080 tiny-password:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz; then break; fi
            [ "$i" = 30 ] && exit 1
            sleep 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/v1/unknown)
          [ "$code" = 404 ] || { echo "unknown api: $code"; exit 1; }
          uid=$(docker exec smoke id -u)
          [ "$uid" != 0 ] || { echo "container must not run as root"; exit 1; }
          docker rm -f smoke
