name: Build Android APK

# 按版本对应的 Release APK 判断是否已发布，只有 tag 时仍可重试构建。
# 沿用仓库中的 debug.keystore，保持与历史 APK 的覆盖安装兼容性。
on:
  push:
    branches: [master]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read app version and decide whether to build
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const gradle = fs.readFileSync('mobile/android/app/build.gradle', 'utf8');
            const versionName = gradle.match(/versionName\s*(?:=\s*)?"([^"]+)"/)[1];
            const versionCode = gradle.match(/versionCode\s*(?:=\s*)?(\d+)/)[1];
            const tag = `app-v${versionName}-${versionCode}`;
            core.setOutput('version_name', versionName);
            core.setOutput('version_code', versionCode);
            core.setOutput('tag', tag);
            let published = false;
            try {
              const {data: release} = await github.rest.repos.getReleaseByTag({
                ...context.repo, tag,
              });
              published = !release.draft && !release.prerelease && release.assets.some(
                asset => asset.name === 'app-release.apk' && asset.state === 'uploaded' && asset.size > 0,
              );
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput('changed', String(!published));
            core.notice(published ? `${tag} already published; skipping.` : `Building APK for ${tag}.`);

      - uses: actions/setup-node@v4
        if: steps.version.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        if: steps.version.outputs.changed == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JS dependencies
        if: steps.version.outputs.changed == 'true'
        working-directory: mobile
        run: npm ci

      - name: Typecheck and unit tests
        if: steps.version.outputs.changed == 'true'
        working-directory: mobile
        run: |
          npx tsc --noEmit
          npx jest --silent

      - name: Build release APK
        if: steps.version.outputs.changed == 'true'
        working-directory: mobile/android
        # Gradle 自动下载缺失的 SDK / Build-Tools / NDK。
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        if: steps.version.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TinyPassword-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: TinyPassword v${{ steps.version.outputs.version_name }} (code ${{ steps.version.outputs.version_code }})
          files: mobile/android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
