# Tiny Password base deployment: initialize the data directory, then run the
# application container.
# The application has no host port by default. Use deploy/compose.lan.yaml for
# a deliberately scoped LAN bind, or enable the tunnel profile below.
services:
  init-secrets:
    # Docker Compose resolves `secrets: file:` before it creates any service,
    # so a normal init container cannot create those files in time. Keep the
    # bootstrap secrets in the persistent data directory instead.
    image: ${TP_INIT_SECRETS_IMAGE:-alpine:3.22}
    restart: "no"
    volumes:
      - "${TP_DATA_DIR_HOST:-/mnt/data/tiny-password}:/data"
    command:
      - /bin/sh
      - -ec
      - |
        set -eu
        umask 077

        data_dir=/data
        secret_dir="$$data_dir/.secrets"
        master_key="$$secret_dir/master_key"
        backup_passphrase="$$secret_dir/backup_passphrase"
        database="$$data_dir/tiny-password.db"

        fail() {
          echo "tiny-password secret initialization failed: $$*" >&2
          exit 1
        }

        # Never invent a new identity for an existing database. A missing or
        # malformed key must be repaired from the operator's protected copy.
        if [ -e "$$database" ]; then
          [ -f "$$master_key" ] || fail "existing database found but master_key is missing"
          [ "$$(wc -c < "$$master_key")" -eq 32 ] || fail "existing database found but master_key is not 32 bytes"
          [ -f "$$backup_passphrase" ] || fail "existing database found but backup_passphrase is missing"
          [ -s "$$backup_passphrase" ] || fail "existing database found but backup_passphrase is empty"
        fi

        mkdir -p "$$secret_dir" "$$data_dir/backups"
        chmod 0700 "$$secret_dir"

        if [ -e "$$master_key" ]; then
          [ -f "$$master_key" ] || fail "master_key is not a regular file"
          [ "$$(wc -c < "$$master_key")" -eq 32 ] || fail "master_key must be exactly 32 bytes"
        else
          tmp_master_key="$$(mktemp "$$secret_dir/.master_key.XXXXXX")"
          head -c 32 /dev/urandom > "$$tmp_master_key"
          chmod 0600 "$$tmp_master_key"
          mv "$$tmp_master_key" "$$master_key"
        fi

        if [ -e "$$backup_passphrase" ]; then
          [ -f "$$backup_passphrase" ] || fail "backup_passphrase is not a regular file"
          [ -s "$$backup_passphrase" ] || fail "backup_passphrase is empty"
        else
          tmp_backup_passphrase="$$(mktemp "$$secret_dir/.backup_passphrase.XXXXXX")"
          head -c 32 /dev/urandom | base64 | tr -d '\n' > "$$tmp_backup_passphrase"
          chmod 0600 "$$tmp_backup_passphrase"
          mv "$$tmp_backup_passphrase" "$$backup_passphrase"
        fi

        # The app image runs as UID/GID 10001 and needs to write SQLite WAL
        # files and local backups in the bind-mounted data directory.
        chown 10001:10001 "$$data_dir" "$$data_dir/backups" "$$secret_dir" "$$master_key" "$$backup_passphrase"
        for database_file in "$$database" "$$database-wal" "$$database-shm"; do
          if [ -e "$$database_file" ]; then
            chown 10001:10001 "$$database_file"
          fi
        done
        chmod 0600 "$$master_key" "$$backup_passphrase"

  app:
    build: .
    image: tiny-password:dev
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    volumes:
      - "${TP_DATA_DIR_HOST:-/mnt/data/tiny-password}:/data"
    tmpfs:
      # Restricted scratch space for sensitive temporary files (D11).
      - /tmp:mode=700,uid=10001,gid=10001,size=512m
    environment:
      TP_ADDR: ":8080"
      TP_DATA_DIR: /data
      TP_MASTER_KEY_FILE: /data/.secrets/master_key
      TP_BACKUP_PASSPHRASE_FILE: /data/.secrets/backup_passphrase
      TP_BACKUP_DIR: /data/backups
      TP_ALLOW_INSECURE_COOKIES: ${TP_ALLOW_INSECURE_COOKIES:-0}
      TP_TRUSTED_PROXY_CIDRS: ${TP_TRUSTED_PROXY_CIDRS:-}
      TP_ARGON2_MEMORY_MIB: "${TP_ARGON2_MEMORY_MIB:-64}"
      TP_ARGON2_ITERATIONS: "${TP_ARGON2_ITERATIONS:-3}"
      TP_ARGON2_PARALLELISM: "${TP_ARGON2_PARALLELISM:-2}"
      TP_ARGON2_MEMORY_BUDGET_MIB: "${TP_ARGON2_MEMORY_BUDGET_MIB:-128}"
      TP_ARGON2_MAX_CONCURRENCY: "${TP_ARGON2_MAX_CONCURRENCY:-2}"
      TP_ARGON2_VERIFY_MAX_MEMORY_MIB: "${TP_ARGON2_VERIFY_MAX_MEMORY_MIB:-128}"
      TP_R2_ACCESS_KEY: "${TP_R2_ACCESS_KEY:-}"
      TP_R2_SECRET_KEY: "${TP_R2_SECRET_KEY:-}"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
          pids: 256
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  tunnel:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/tunnel_token"]
    depends_on:
      app:
        condition: service_healthy
    secrets:
      - tunnel_token
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped

secrets:
  tunnel_token:
    # The inactive profile must not make the default app deployment depend on
    # a Tunnel file. Set TP_TUNNEL_TOKEN_SOURCE before enabling the profile.
    file: ${TP_TUNNEL_TOKEN_SOURCE:-/dev/null}
